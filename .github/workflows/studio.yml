name: studio

# The eve studio lives outside `bazel build //...` (see .bazelignore), so it
# needs its own gate. A generated gRPC client that nothing regenerates and
# diffs is exactly the unchecked declaration this repo is built around —
# `//tools:catalog_check` exists because a Catalog nothing compared was already
# false, and a TypeScript client nobody compares would be the same failure in a
# second language.
on:
  push:
    branches: [main]
    paths: ["studio/**", "proto/**", "service/**", "gen/**", "wsgi.py", "vercel.json", "requirements.txt", ".github/workflows/studio.yml"]
  pull_request:
    paths: ["studio/**", "proto/**", "service/**", "gen/**", "wsgi.py", "vercel.json", "requirements.txt", ".github/workflows/studio.yml"]

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: studio

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck

      # The two suites that need no service: the contract tests hold the zod
      # schemas against the generated descriptors, and the roster test holds the
      # studio's specialist directory against `agent/subagents/`.
      - run: node --import tsx --test tests/contract.test.ts tests/roster.test.ts

      # The rest DO need a live service, because a mocked transport would prove
      # only that the mock works. They run TWICE below, once per wire.
      #
      # `npm test` rather than a list of files. Naming them was how
      # `tests/proto-json.test.ts` — the regression gate for a conversion bug
      # that made every agent-side `render_mark` fail — came to run nowhere at
      # all. A glob has nothing to keep in sync.
      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          repository-cache: true
      # For the Connect run below, which serves the door from this checkout
      # rather than through Bazel — the same interpreter the deployment uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # BUILD FIRST, THEN RUN. `bazel run` builds before it serves, and on a
      # cold cache that build compiles protobuf and gRPC from source — five
      # minutes of it. The wait loop below then spent its whole 60 seconds
      # watching a port that nothing had got round to binding yet, and every
      # test failed with ECONNREFUSED against a server that was fine.
      #
      # Splitting the build out also puts a build failure in a step that says
      # "build", instead of surfacing as a connection error two steps later.
      - name: build the service before waiting on it
        working-directory: .
        run: bazel build //service:server

      # BOTH WIRES, BECAUSE THE CLIENT CLAIMS BOTH.
      #
      # `agent/lib/brando/client.ts` says two transports, one service, and the
      # callers do not know the difference. Only one of them was ever run here,
      # and after the Connect door landed it was the WRONG one: the default
      # transport became Connect over HTTP/1.1 while this job kept serving gRPC,
      # so every test failed with `Parse Error: Expected HTTP/, RTSP/ or ICE/` —
      # an HTTP/2 SETTINGS frame arriving at an HTTP/1.1 parser. CI had been
      # proving a wire the deployment does not use.
      #
      # So: gRPC against the Bazel server, then Connect against the door, which
      # is what a Vercel deployment actually speaks.
      - name: gRPC — the wire //service:conformance_test holds the service to
        working-directory: .
        run: |
          set -eux
          bazel run //service:server -- --port 50051 &
          for _ in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null && break
            sleep 1
          done
          # Fail HERE, naming the reason, rather than in a test whose error is
          # ECONNREFUSED and whose cause is somewhere else entirely.
          (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null \
            || { echo "the service never bound :50051"; exit 1; }
          cd studio
          BRANDO_SERVICE_URL=http://localhost:50051 BRANDO_TRANSPORT=grpc npm test

      - name: Connect — the wire the deployment speaks
        working-directory: .
        run: |
          set -eux
          pip install -r requirements.txt
          PYTHONPATH="$PWD:$PWD/gen" python -m service.connect_app --port 8787 &
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/8787) 2>/dev/null && break
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/8787) 2>/dev/null \
            || { echo "the Connect door never bound :8787"; exit 1; }
          cd studio
          BRANDO_SERVICE_URL=http://localhost:8787 npm test

      # The eve app has to actually compile: `eve build` is what discovers the
      # agent tree, so a subagent with no description or a tool whose filename
      # is not a legal slug fails here rather than at the first request.
      - run: npx eve build

      # THE NEXT BUILD, ON THE BRANCH VERCEL ACTUALLY TAKES.
      #
      # `withEve()` runs whenever next.config.ts loads, and it FORKS on whether a
      # linked Vercel project exists at or above the app: with one, it asserts
      # that the root vercel.json's `services` include an eve service and throws
      # if not; without one, it silently writes a generated services block.
      # A plain `next build` here takes the second branch, so it proved nothing
      # about the deployment — the root vercel.json shipped for a while with no
      # eve service, and this build was green the whole time.
      #
      # A stub `.vercel/project.json` puts CI on the same branch Vercel is on.
      # It holds no real ids and is deleted immediately; it exists only to make
      # `findClosestLinkedVercelDirectory` resolve to the repo root.
      - name: build Next.js the way Vercel will, with a linked project above it
        working-directory: .
        run: |
          set -eux
          trap 'rm -rf .vercel' EXIT
          mkdir -p .vercel
          echo '{"projectId":"prj_ci_stub","orgId":"team_ci_stub"}' > .vercel/project.json
          cd studio
          npm run build

  # The generated client, regenerated and diffed. A proto change that nobody
  # regenerated ships a client that disagrees with the server, and the
  # disagreement is silent: a dropped field decodes as a default.
  generated_client_is_current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: npm ci
      - name: regenerate from the descriptor set the linter checked
        working-directory: .
        run: |
          set -eux
          bazel build //proto/brando/v1:brand_service_descriptor_set
          cp -L bazel-bin/proto/brando/v1/brand_service_descriptor_set.binpb \
            studio/.image.binpb
          cd studio
          npx buf generate .image.binpb
          rm .image.binpb
      - run: git diff --exit-code agent/lib/brando/gen

  # The VENDORED PYTHON STUBS, regenerated and diffed.
  #
  # Same argument as the TypeScript client one above, in the other language.
  # `gen/` exists because the deployed deterministic tier has no Bazel to build
  # stubs from, and generated code that nothing compares is drift with a
  # plausible face: a renamed proto field decodes as a default, silently.
  generated_python_stubs_are_current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio-tools protobuf
      - name: regenerate from the descriptor set the linter checked
        # `defaults.run.working-directory` is `studio` for this whole file, which
        # is right for every npm step and wrong for every Bazel one — without
        # this the job ran `python service/gen_stubs.py` from inside studio/ and
        # died on "No such file or directory".
        working-directory: .
        run: |
          set -eux
          bazel build //proto/brando/v1:brand_service_descriptor_set
          for proto in proto/theme.proto brando/v1/brand.proto brando/v1/brand_service.proto; do
            python service/gen_stubs.py \
              --descriptor_set bazel-bin/proto/brando/v1/brand_service_descriptor_set.binpb \
              --out_dir gen --proto "$proto"
          done
      - name: the vendored stubs match the schema
        working-directory: .
        run: git diff --exit-code gen

      # The deployed entrypoint must import with no Bazel and no runfiles — which
      # is the whole point of vendoring, and the thing that breaks first.
      #
      # `requirements.txt` is the SERVICE's manifest; the build's lock is
      # `requirements-bazel.txt`. Vercel resolves a Python manifest by filename
      # from a fixed list, so the deployed tier owns the plain name — and this
      # step installs exactly what the deployment will.
      - run: pip install -r requirements.txt
      - run: python -c "import wsgi; assert callable(wsgi.app)"
