// brando.v1 — a brand as data.
//
// TWO MESSAGES, AND THE SPLIT BETWEEN THEM IS THE POINT.
//
// `BrandSpec` is the INPUT: what a person (or, later, a model) authors. It is the
// single place a brand states its identity, and everything else is derived from
// it. `BrandPackage` is the OUTPUT: a built brand, with every artifact named,
// content-addressed, and traceable back to the spec digest it came from.
//
// WHY THIS EXISTS AT ALL. Today a repo that merely WEARS a brand must also be a
// full Bazel brand PIPELINE — shapely, Pillow, a pip lock, generators. That is why
// meridian-playground/tools/regen_skins.sh hardcodes four absolute local repo
// paths and runs brando's converter outside Bazel to get theme JSON, and why three
// separate TypeScript codebases still hardcode the palette. Splitting "producing a
// brand" from "wearing one" is the whole job of the `.brando` archive: a consumer
// takes the package and needs none of the machinery that made it.
//
// The theme is NOT redefined here. `meridian.theme.v1.Theme` is already the
// fleet's contract for what a brand looks like at runtime, and a second, subtly
// different copy of it is precisely the kind of drift this file exists to end.
syntax = "proto3";

package brando.v1;

import "google/protobuf/timestamp.proto";
// NB: `proto/theme.proto`, not `meridian/theme/v1/theme.proto`. meridian_schemas
// declares its theme_proto with no strip_import_prefix, so its import path is its
// repo-relative one and does not match its proto package. That is upstream's
// AIP-191 gap, not something to paper over here with a second copy of the file.
import "proto/theme.proto";

option java_multiple_files = true;
option java_package = "dev.brando.v1";
option java_outer_classname = "BrandProto";

// Everything a brand states about itself. The one authored artifact.
message BrandSpec {
  // Stable identifier, lowercase, e.g. "leangres". Also the archive's basename.
  string id = 1;

  // Human-facing name, e.g. "tomato-bazel". May differ from `id` in case and
  // punctuation; renderers show this, never `id`.
  string display_name = 2;

  Identity identity = 3;

  // The runtime look, in the fleet's existing contract. Reused, not re-declared.
  meridian.theme.v1.Theme theme = 4;

  MarkSpec mark = 5;

  // Faces this brand ships, with provenance. A stack in `theme.typography` is a
  // list of NAMES; without a source the browser silently substitutes and the
  // brand is quietly not applied — a failure invisible in review and in
  // screenshots taken on a designer's machine.
  repeated FontSource fonts = 6;

  // Which artifacts a complete build of this brand produces.
  Catalog catalog = 7;

  Copy copy = 8;
}

// What the brand MEANS, as opposed to what it looks like. Carried because a
// brandbook is the thing that settles arguments a palette cannot: whether a
// colour may be used as text, what the mark may sit on, how the brand speaks.
message Identity {
  // The legal entity, when it differs from `display_name`.
  string legal_name = 1;

  // One line. Appears in lockups and office templates.
  string tagline = 2;

  // What the brand is for, in a sentence or two.
  string positioning = 3;

  // How the mark is meant to be read — aion's glyph is deliberately four
  // readings at once, and losing that is losing the brand.
  string story = 4;

  // Voice attributes, e.g. "helpful", "expert not snobby".
  repeated string voice = 5;

  // Rules that constrain USE rather than appearance, e.g. "the light-blue logo
  // goes on white only". These are the statements a contrast checker cannot
  // derive and a designer must not have to remember.
  repeated string usage_rules = 6;

  // Where the authoritative brandbook lives, if there is one.
  string brandbook_uri = 7;
}

// How the mark is produced, and where its geometry lives.
//
// THIS MESSAGE USED TO SAY "brando does NOT model geometry", and that was the
// right call for as long as the only way to state a drawing was to write code.
// Mark construction is genuinely per-brand — aion's ring/bar/stem, fastverk's
// phi-triangle, meridian's refracted beam — so a spec named a `generator` and a
// build ran it, which is why a SERVICE handed a spec could never produce a mark.
//
// `MarkProgram` narrows that claim rather than overturning it. Geometry that is
// primitives, boolean operations and arithmetic over named parameters is data,
// and brando can model it. Geometry that is genuinely a program — tomato's
// facets, whose layer membership falls out of `atan2` of a midpoint and whose
// COUNT is not known until the CSG runs — is not, and `generator` remains the
// supported path for it. Set exactly one; the two are alternatives, not a
// legacy field and its replacement.
message MarkSpec {
  // Bazel label of the brand's generator, e.g. "//gen:gen_mark".
  string generator = 1;

  // Variant names the generator emits, e.g. "mark", "icon".
  repeated string variants = 2;

  // Layer suffixes per variant, e.g. "svg", "glyph.svg", "bg.svg", "flat.svg".
  repeated string layers = 3;

  // Raster sizes in px.
  repeated int32 sizes = 4;

  // Variants that additionally get .icns and .ico. A list rather than a bool
  // because brands genuinely differ about which icon a desktop installs.
  repeated string packed = 5;

  // Optical padding as a fraction of the canvas, per side (marklib.fit's `pad`).
  float pad = 6;

  // Supersample factor for rasterization.
  int32 supersample = 7;

  // The mark as DATA, rather than as a Bazel label naming code that draws it.
  //
  // WHY BOTH FIELDS EXIST. `generator` is a label; a service handed a spec cannot
  // execute it, which is why `RenderService` refuses to produce a mark and says
  // so. That refusal is correct — running a caller-supplied generator is remote
  // code execution, not a feature — but it leaves the one artifact a brand is
  // most identified by outside the system entirely.
  //
  // A `MarkProgram` closes that without reopening it: the drawing is a closed,
  // schema-checked vocabulary of primitives, boolean operations and arithmetic
  // over named parameters, so executing it is evaluation rather than execution.
  // It stays re-renderable at any size, which is the property a rasterized logo
  // loses and the whole reason marklib exists.
  //
  // Set exactly one. A repo that owns its geometry in Python keeps `generator`
  // and changes nothing.
  MarkProgram program = 8;
}

// A mark, as data a deterministic interpreter can execute.
//
// THIS IS A DRAWING, NOT A DRAWING PROGRAM IN THE TURING SENSE, and the
// difference is the point. There is no assignment, no recursion and no
// unbounded loop: `params` are solved once in order, `shapes` form a DAG, and
// `repeat` runs a count fixed before it starts. An interpreter for it always
// terminates, which is what makes it safe to accept from a model or over the
// wire.
//
// Every numeric field is a STRING holding an arithmetic expression over the
// program's own parameters -- `"stem_x + stem_w"`, not `33.0`. That is what
// makes the mark parametric rather than merely serialized: changing `stem_w`
// moves the bar, because the bar's position was never a number in the first
// place. Every real generator in this repo already works this way; citizen-sh
// says so outright ("spacing is SOLVED rather than tabulated, so changing
// `columns` cannot leave the colonnade off-centre").
message MarkProgram {
  // Solved in order. A later parameter may reference an earlier one, which is
  // how a generator's derived measurements -- leangres's `mid`, the vertical
  // midpoint both the bar and the halmos are placed against -- stay derived
  // instead of being restated at each use.
  repeated Param params = 1;

  // A named DAG. Order matters only in that a shape may reference shapes
  // declared before it.
  repeated Shape shapes = 2;

  // Back to front, exactly as a brand adds them to a marklib Canvas.
  repeated LayerDef layers = 3;

  repeated VariantDef variants = 4;

  FitDef fit = 5;

  // Canvas edge in px. 1024 when unset, matching every generator in this repo.
  int32 canvas = 6;

  // Corner radius of the background square, as a fraction of the canvas.
  // marklib's 0.20 when empty.
  string bg_round = 7;
}

// One solved measurement, or one table of them.
//
// A SCALAR IS NOT ENOUGH, and the corpus says so plainly. brando's own mark
// carries `fingers` as four 3-tuples of hand-tuned values and `attach_xs` as a
// 4-tuple; tomato carries per-facet point lists. None of those is a formula over
// an index — they are tables, and a parameter language that cannot hold a table
// forces the drawing back into code.
message Param {
  string name = 1;

  oneof form {
    // An arithmetic expression; a bare number is the degenerate case.
    string value = 2;
    // An ordered list of expressions, addressed as `name[i]`.
    ExprList list = 3;
    // Rows of expressions, addressed as `name[i][j]` and bindable by `repeat`.
    ExprTable table = 4;
  }
}

message ExprList {
  repeated string values = 1;
}

message ExprTable {
  repeated ExprList rows = 1;
}

// A point in model space. Both components are expressions.
message Point {
  string x = 1;
  string y = 2;
}

// One node of the geometry DAG: a primitive, an operation over other shapes, or
// an affine transform of one.
message Shape {
  // How later shapes and layers refer to this one. Empty is legal only for a
  // `repeat` body, which is instantiated rather than referenced.
  string name = 1;

  oneof form {
    Rect rect = 2;
    Poly poly = 3;
    Ngon ngon = 4;
    Circle circle = 5;
    RoundedRect rounded_rect = 6;
    Polyline polyline = 7;

    // Boolean operations. `union` is a reserved word in several languages
    // generated bindings target, so the union is `combine`; AIP-140 rules out
    // the `*_of` spelling these three carried first, and the linter is right —
    // `difference { base: ... subtract: ... }` reads better than
    // `difference_of` ever did.
    Combine combine = 8;
    Combine intersect = 9;
    Difference difference = 10;

    // `distance: "0"` is the standard shapely self-intersection repair, which
    // every generator in this repo relies on.
    Buffer buffer = 11;

    Rotate rotate = 12;
    Translate translate = 13;
    Scale scale = 14;

    Repeat repeat = 15;
  }
}

// An axis-aligned rectangle.
message Rect {
  string x0 = 1;
  string y0 = 2;
  string x1 = 3;
  string y1 = 4;
}

// An explicit polygon. Named `Poly` rather than `Polygon` so a generated
// binding does not collide with the geometry type of whatever library reads it.
message Poly {
  repeated Point points = 1;
}

// A regular polygon, optionally elliptical. Three generators here hand-roll
// exactly this as `_ngon`, which is a fair sign it belongs in the vocabulary.
message Ngon {
  string cx = 1;
  string cy = 2;
  string rx = 3;
  string ry = 4;
  string sides = 5;
  string rot_deg = 6;
}

// A circle, approximated as a polygon. `segments` defaults to 96 -- the value
// `selfbrand`'s generator uses, chosen so the curve survives a 1024px render.
message Circle {
  string cx = 1;
  string cy = 2;
  string r = 3;
  string segments = 4;
}

// A rectangle with rounded corners, built the way the generators build it: a
// box buffered outward with a mitre-free join.
message RoundedRect {
  string x0 = 1;
  string y0 = 2;
  string x1 = 3;
  string y1 = 4;
  string radius = 5;
  string quad_segs = 6;
}

// A stroked path: the capsules and tapered fingers marks are actually made of.
message Polyline {
  repeated Point points = 1;
  // Half-width, matching how the generators buffer a LineString.
  string half_width = 2;
  // Ratio of the end width to `half_width`; 1 (or empty) is an untapered
  // capsule.
  string taper = 3;
}

// Union or intersection of two or more shapes, by name.
message Combine {
  repeated string shapes = 1;
}

// `base` minus every shape in `subtract`.
message Difference {
  string base = 1;
  repeated string subtract = 2;
}

// Buffering is where byte-identical output is won or lost, so every option
// shapely takes is stated rather than defaulted: brando's own mark buffers at
// `quad_segs=24` in one place and `quad_segs=12` in another, and a hairline seam
// is closed by a positive buffer followed by an equal NEGATIVE one. An
// interpreter that quietly picked shapely's defaults would produce a plausible
// mark with different coordinates.
message Buffer {
  string shape = 1;
  // May be negative, which erodes rather than grows. `"0"` is the standard
  // self-intersection repair every generator here relies on.
  string distance = 2;
  string quad_segs = 3;
  // shapely's join style: 1 round, 2 mitre, 3 bevel. Round when empty.
  string join_style = 4;
  // shapely's cap style: 1 round, 2 flat, 3 square. Round when empty.
  string cap_style = 5;
  string mitre_limit = 6;
}

message Rotate {
  string shape = 1;
  string angle_deg = 2;
  // The model-space origin. The geometry's own centroid when absent.
  Point origin = 3;
}

message Translate {
  string shape = 1;
  string dx = 2;
  string dy = 3;
}

message Scale {
  string shape = 1;
  string sx = 2;
  string sy = 3;
  Point origin = 4;
}

// The same body, `count` times, with an index bound so each instance can differ.
//
// This is what makes a colonnade, a blade fan or a stack of bars one statement
// rather than N. The body sees the loop variable (`i`, 0-based) and `n`, and
// nothing else new; positions are closed-form functions of `i` rather than a
// running total, which is how they stay solvable in one pass.
message Repeat {
  // The number of instances. Ignored when `table` names one, whose row count
  // decides instead.
  string count = 1;
  // Defaults to "i".
  string index_var = 2;
  Shape body = 3;
  // A table parameter to walk. Each row is bound as `row`, addressed `row[j]`,
  // which is how a per-instance table of hand-tuned values -- brando's own
  // `fingers` -- drives the body without becoming a formula it is not.
  string table = 5;
  // Instances are unioned by default. Set to keep them separate -- a fan whose
  // blades alternate tone needs the pieces, not the union.
  bool separate = 4;
}

// A colour: either stated outright, or resolved from the brand's own Theme.
//
// A LITERAL IS THE DEFAULT, AND THAT IS DELIBERATE. A mark's facet colours are
// usually not palette roles, and tomato's skin says so as a decision rather than
// a concession: "gen_tomato_v2's body #E64A33 and calyx #43A047 are the logo's
// own facet colours and are not palette roles." Binding a logo's red to
// `theme.accent` would make a palette change silently redraw the mark, which is
// the opposite of what a brand wants.
//
// The theme reference exists for the colours that genuinely ARE roles -- the
// ground a mark sits on, the foreground it is drawn in. Those are the ones that
// drift: fastverk's LaTeX class said #E0A33E where its skin said #F2C46A, and
// nothing compared them. Where a role is the truth, naming it means the two
// cannot disagree.
message ColorRef {
  oneof source {
    // "#RGB", "#RRGGBB" or "#RRGGBBAA".
    string literal = 1;
    ThemeColor theme = 2;
  }
}

// A role in one of the brand's two palettes.
//
// `mode` is stated rather than inherited from the variant, because a mark's
// light and dark forms are not the UI's. leangres draws its turnstile in the
// LIGHT palette's `bg` when it sits on ink: paper on ink, which is a different
// statement from "the dark palette's foreground".
message ThemeColor {
  // "light" or "dark".
  string mode = 1;
  // A meridian.theme.v1.Palette field name, e.g. "accent", "fg", "bg".
  string role = 2;
}

// A colour in each of the two forms a mark takes. The variant's `mode` picks.
message ModalColor {
  ColorRef light = 1;
  ColorRef dark = 2;
}

// One layer of the mark, corresponding exactly to a marklib Canvas layer.
message LayerDef {
  // Also the layer's filename suffix: `<prefix>_<variant>.<name>.svg`.
  string name = 1;

  // The shape this layer draws, by name.
  string shape = 2;

  ModalColor fill = 3;

  Gradient gradient = 4;

  // Carried into the Icon Composer manifest. "normal" when empty.
  string blend = 5;

  // 0..1, for soft overlays such as a specular highlight. 1 when empty.
  string opacity = 6;

  // Drawn in the composite but written to no file of its own -- marklib's
  // `emit_file=False`. Inverted relative to that field so the default (false)
  // is the ordinary case: brando's own mark has exactly one such layer, the ink
  // halo that separates the hand from the bar, and it has no standalone asset
  // and no entry in any BUILD file.
  bool composite_only = 7;
}

// An N-stop linear gradient, in the form marklib already accepts.
message Gradient {
  repeated GradientStop stops = 1;
  // In the SVG frame: 90 is top-to-bottom, 0 is left-to-right.
  string angle_deg = 2;
}

message GradientStop {
  // 0..1. Evenly spaced when every stop leaves it empty.
  string offset = 1;
  ModalColor color = 2;
}

// One rendering of the mark: which palette its colours resolve in, and what it
// sits on.
message VariantDef {
  string name = 1;

  // "light" or "dark" -- which half of every ModalColor this variant takes.
  string mode = 2;

  // The background square. Absent means transparent, which is why this is a
  // message rather than a string: "no ground" and "an unset ground" are the
  // same mistake waiting to happen otherwise.
  ModalColor ground = 3;

  // Parameters this variant changes. brando's own variants differ by whether the
  // bar carries a gradient; a variant that were only ever a mode and a ground
  // would not reach them, and the brand would need a second program to say one
  // different thing.
  repeated Param param_overrides = 4;
}

// How model space maps to pixels: marklib.fit's arguments, as data.
message FitDef {
  // Exactly one, mirroring `fit()`'s own contract.
  oneof extent {
    // Fit to the bounds of this shape -- the usual case, where the geometry
    // decides the frame.
    string bounds = 1;
    // Half the model-space width the mark should occupy.
    string half_extent = 2;
    // An explicit pixels-per-model-unit.
    string scale = 3;
  }

  // A fraction of the FULL canvas, per side.
  string pad = 4;

  // The model point that lands at the canvas centre. The bounds' centre in
  // `bounds` mode, the origin otherwise.
  Point center = 5;

  // marklib flips y by default, because these model spaces are y-up and pixels
  // are not. Set only for a model space that is already y-down. Inverted so the
  // default is the flip every generator here wants -- citizen-sh's first render
  // came out with the foundation resting on top of the columns, and that is the
  // failure this default prevents.
  bool no_flip_y = 6;
}

// An obtainable font file. Mirrors meridian.theme.v1.FontSource, plus the
// provenance a vendored binary needs to remain a licence question anyone can
// answer later.
message FontSource {
  // MUST match how the face is named in the theme's typography stacks. This is
  // the join key between the stack and the file.
  string family = 1;
  string src_uri = 2;
  // CSS font-weight: a single weight ("400") or a variable range ("100 900").
  string weight = 3;
  // "normal" (default when empty) or "italic".
  string style = 4;
  string unicode_range = 5;
  // CSS font-display; "swap" when empty.
  string display = 6;

  // Provenance. A vendored binary with no sha256 and no licence is a question
  // nobody can answer six months on.
  string sha256 = 7;
  string license = 8;
  string upstream_uri = 9;
}

// WHICH artifacts a complete build produces. This is the formalization: without
// it, "what does a brand include" is whatever a given repo happened to wire up —
// which is how one brand came to produce 17 artifact types and another 2.
message Catalog {
  repeated ArtifactKind kinds = 1;

  // Extra artifacts that are real but not in the standard vocabulary.
  repeated string custom = 2;
}


// Prose the brand supplies, so brando's office and brandbook templates stop
// carrying hardcoded English. pptx_gen.py currently ships "The mark", "Light &
// dark" and "Brand deck · generated from one parametric source" as literals in
// every brand's deck.
message Copy {
  string deck_title = 1;
  string deck_subtitle = 2;
  string mark_section_title = 3;
  string color_section_title = 4;
  string type_section_title = 5;
  string closing = 6;

  // Free-form named strings for a brand's own templates.
  map<string, string> extra = 7;
}

// A BUILT brand: the manifest inside a `.brando` archive.
message BrandPackage {
  // The spec this was built from, carried whole so a package is self-describing
  // and a consumer never has to go find the repo it came from.
  BrandSpec spec = 1;

  repeated Asset assets = 2;

  Provenance provenance = 3;
}

// One artifact in the archive.
message Asset {
  // Logical name a consumer asks for, e.g. "theme.json", "mark/aion_mark.svg".
  // Stable across rebuilds; this is what `rules_brand` exposes as a target.
  string name = 1;

  // Path INSIDE the archive. Content-addressed ("assets/<sha256>"), so identical
  // bytes appear once however many logical names point at them.
  string path = 2;

  string media_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;

  ArtifactKind kind = 6;

  // For per-variant/size artifacts, so a consumer can ask for "the 512px icon"
  // without parsing filenames.
  string variant = 7;
  int32 size_px = 8;
  // "light" | "dark" where an artifact is mode-specific.
  string mode = 9;
}

// Where a package came from. Without this a `.brando` is a bag of files with no
// way to tell which commit or which brando produced it.
message Provenance {
  // brando's own module version, e.g. "0.2.0".
  string brando_version = 1;

  // sha256 of the serialized BrandSpec. Two packages with the same digest were
  // built from the same stated brand.
  string spec_digest = 2;

  // Source repo and commit, when known.
  string source_repo = 3;
  string source_commit = 4;

  google.protobuf.Timestamp build_time = 5;

  // Contrast findings at build time, recorded rather than merely printed — a
  // package that shipped with a known-unreadable pair should say so.
  repeated ContrastFinding contrast = 6;
}

message ContrastFinding {
  // "light" | "dark".
  string mode = 1;
  string foreground_role = 2;
  string background_role = 3;
  float ratio = 4;
  float minimum = 5;
  Severity severity = 6;

  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    // The pair's usage is unambiguous and it is unreadable.
    SEVERITY_ERROR = 1;
    // The role is rendered more than one way; a human decides.
    SEVERITY_WARN = 2;
  }
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;

  // Layered mark SVGs, per variant x layer.
  ARTIFACT_KIND_MARK_SVG = 1;
  // Raster marks at the catalog's sizes.
  ARTIFACT_KIND_MARK_PNG = 2;
  // .icns / .ico bundles.
  ARTIFACT_KIND_ICON_PACKED = 3;
  // Icon Composer .icon bundle.
  ARTIFACT_KIND_ICON_COMPOSER = 4;
  // favicon.ico + favicon.svg + apple-touch + maskable + webmanifest.
  ARTIFACT_KIND_FAVICON = 5;

  ARTIFACT_KIND_WORDMARK = 6;
  ARTIFACT_KIND_LOCKUP = 7;

  // meridian.theme.v1 wire forms.
  ARTIFACT_KIND_THEME_BINPB = 8;
  ARTIFACT_KIND_THEME_JSON = 9;
  // CSS custom properties.
  ARTIFACT_KIND_THEME_CSS = 10;

  ARTIFACT_KIND_MDBOOK_THEME = 11;
  ARTIFACT_KIND_LATEX_CLASS = 12;
  ARTIFACT_KIND_BRANDBOOK_PDF = 13;
  ARTIFACT_KIND_OFFICE_PPTX = 14;
  ARTIFACT_KIND_OFFICE_DOCX = 15;

  // Construction / grid / clearspace plates.
  ARTIFACT_KIND_GUIDELINE_DIAGRAMS = 16;
  // The contrast matrix, as a rendered artifact rather than a build log.
  ARTIFACT_KIND_CONTRAST_MATRIX = 17;

  // ANSI palette + terminal themes — the TUI renderer's half of the contract.
  ARTIFACT_KIND_TERMINAL_THEME = 18;
  // OG card, avatar, social preview.
  ARTIFACT_KIND_SOCIAL = 19;

  ARTIFACT_KIND_FONTS = 20;
}
